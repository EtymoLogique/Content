[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "etymo-contenu"
version = "0.1.0"
description = "Outillage éditorial du catalogue ÉtymoLogique : schémas et validation locale."
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.18"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
etymo-contenu = "etymo_contenu.cli:main"

[tool.setuptools.packages.find]
where = ["outils"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["outils"]
