name: Validate content

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  RUST_VERSION: "1.98"

concurrency:
  group: validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --component clippy,rustfmt
          rustup default "$RUST_VERSION"

      - name: Cache the build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: outils
          shared-key: outillage

      - name: Check the formatting
        run: cargo fmt --manifest-path outils/Cargo.toml --check

      - name: Lint
        run: cargo clippy --manifest-path outils/Cargo.toml --all-targets --locked -- -D warnings

      - name: Run the tests
        run: cargo test --manifest-path outils/Cargo.toml --locked

      - name: Validate the catalogue
        run: cargo run --manifest-path outils/Cargo.toml --locked -q -- valider
